# mise が入れた道具を PATH の先頭に置きます。既定の false では末尾に足すので、
# システムの node や python が先に見つかり、下の [tools] が実質何も決めていない
# 状態になります。
[settings]
activate_aggressive = true

[tools]
node = "26"
python = "3.14"
bun = "1.3"
# ほぼ全てのタスクが `uv run` で始まるのに、道具として宣言されていませんでした。
# 手元では別に入れた uv が拾われるので気付きませんが、CI や他人の環境では最初の
# タスクで転びます。依存を解決する uv 自身をここで決めます。
uv = "0.12"

[env]
# データ生成のコード一式。
PIPELINE = "pipeline"
# 生成系の入口は全部 `uv run` なので、どの Python で地図が作られるかは uv が
# 決めていました。スクリプトの requires-python は >=3.12 としか言わないので、
# uv は手持ちの最も新しい物を選び、__pycache__ には 3.13 と 3.14 の両方の跡が
# 残っていました。上の [tools] に決めさせます。
UV_PYTHON = "3.14"
# コンソールが表せない字で落ちないようにします。文字コードは変えず、扱いだけ
# 変えます。日本語 Windows の cp932 は「尾駮バイパス」の駮も区切りの — も
# 表せず、青森県の判定と PMTiles の書き出しが最後の 1 行で落ちました。
PYTHONIOENCODING = ":replace"

[tasks.fetch-pbf]
description = "Geofabrik から japan-latest.osm.pbf を取得する(約 2.5 GB)"
# 1 行で書きます。mise は Windows では cmd に渡すので、複数行の run は 1 行目
# しか実行されず、しかもエラーを出さずに成功します。--create-dirs が mkdir の
# 代わりをします。
run = "curl -L --retry 3 -C - --create-dirs -o build/pbf/japan-latest.osm.pbf https://download.geofabrik.de/asia/japan-latest.osm.pbf"

[tasks.extract]
description = "pbf から 47 都道府県ぶんのキャッシュを切り出す"
run = "uv run {{env.PIPELINE}}/extract_pbf.py {{arg(name='regions', var=true, default='')}}"

[tasks.build-all]
description = "全地域を作り直し、結合して配信データまで通す"
run = "uv run {{env.PIPELINE}}/build_all.py {{arg(name='regions', var=true, default='')}}"

[tasks.build]
description = "1 地域を取得から検証まで通す"
run = "uv run {{env.PIPELINE}}/pipeline.py {{arg(name='region', default='nagano')}}"

[tasks.rebuild]
description = "1 地域をキャッシュから再生成する(取得しない)"
run = "uv run {{env.PIPELINE}}/pipeline.py {{arg(name='region', default='nagano')}} --skip-fetch"

[tasks.pack]
description = "build/regions/ から web/data/ を作り直す"
# 段の順番は build_all.py が持ちます。ここに書き写した複製は、複数行の run が
# Windows で 1 行目しか実行されないせいで、タイルを切っただけでエラーも出さずに
# 終わり、PMTiles にも全国検証にも届いていませんでした。
run = "uv run {{env.PIPELINE}}/build_all.py --pack-only"

[tasks.publish-data]
description = "web/data/ を R2(data.nanase.cc)に上げる"
# データは git に入れません。R2 の資産として置き、サイトはそこから直接読みます。
run = "uv run {{env.PIPELINE}}/publish_data.py"

[tasks.cf-cache]
description = "nanase.cc の Cloudflare キャッシュ設定を取得し、pipeline/cf-cache.json へ書き出す"
run = "uv run {{env.PIPELINE}}/cf_cache.py"

[tasks.cf-cache-diff]
description = "pipeline/cf-cache.json と実際の Cloudflare キャッシュ設定の差分を出す"
run = "uv run {{env.PIPELINE}}/cf_cache.py --diff"

[tasks.decree]
description = "政令の別表から起点・終点を取り込み、座標を当てる"
# 政令は年に数回しか変わらないので取得はキャッシュします。90 日を過ぎると
# 取り直し、`--refresh` を渡せばその場で取り直します。
run = "uv run {{env.PIPELINE}}/decree.py {{arg(name='flags', var=true, default='')}}"

[tasks.audit]
description = "途切れている路線を機械的に探す"
run = "uv run {{env.PIPELINE}}/audit.py {{arg(name='region', default='nagano')}}"

[tasks.compare]
description = "Overpass 由来の基準と pbf 由来の生成物を突き合わせる"
run = "uv run {{env.PIPELINE}}/compare_sources.py {{arg(name='region', default='nagano')}}"

[tasks.compare-n13]
description = "国土数値情報 N13(道路)と突き合わせ、OSM に無い国道の候補を探す"
run = "uv run {{env.PIPELINE}}/compare_n13.py {{arg(name='region', default='nagano')}}"

[tasks.apply-n13]
description = "former のうち N13 で指定解除を機械確認できたものに revoked を書き込む"
run = "uv run {{env.PIPELINE}}/apply_n13.py {{arg(name='region', default='nagano')}}"

[tasks.pack-n13]
description = "N13 のメッシュを packed の形へ用意し、古い JSON キャッシュを片づける"
# build-all が県の並列に入る前に自分で呼びます。単独で先に回すのは、初回の
# 移行(全国 285 メッシュ、約 20 分)をビルドとは別の時間に済ませたいときです。
run = "uv run {{env.PIPELINE}}/pack_n13.py {{arg(name='flags', var=true, default='')}}"

[tasks.compare-annual-report]
description = "道路統計年報と延長を突き合わせ、差の内訳を出す"
# 渡せるのは上下線分離を見る側方の距離だけです。既定の 40 m を疑うときに
# 使います。
run = "uv run {{env.PIPELINE}}/compare_annual_report.py {{arg(name='flags', var=true, default='')}}"

[tasks.survey-pref]
description = "都道府県道になりうる way を全国から測り、build/survey に残す"
# 判定(#98)より先に立てた検証の土台です。pbf を一度だけ読みます。
run = "uv run {{env.PIPELINE}}/survey_prefectural.py {{arg(name='flags', var=true, default='')}}"

[tasks.build-pref]
description = "build/survey から都道府県道を判定し、build/prefectural を作る"
# pbf は読みません。読むのは survey-pref が落とした県ごとのファイルです。
run = "uv run {{env.PIPELINE}}/build_prefectural.py {{arg(name='regions', var=true, default='')}}"

[tasks.compare-annual-report-pref]
description = "都道府県道の延長を年報の表11・表12・表13 と突き合わせ、差の内訳と重用の復元率を出す"
run = "uv run {{env.PIPELINE}}/compare_annual_report_pref.py {{arg(name='flags', var=true, default='')}}"

[tasks.compare-n13-pref]
description = "国土数値情報 N13 と突き合わせ、OSM に無い都道府県道の量を測る"
run = "uv run {{env.PIPELINE}}/compare_n13_pref.py {{arg(name='flags', var=true, default='')}}"

[tasks.serve]
description = "ローカルサーバを起動する (http://localhost:8000/)"
# PMTiles は Range 要求で読むので、http.server では配れません。
run = "uv run {{env.PIPELINE}}/serve.py {{arg(name='port', default='8000')}}"

[tasks.render-check]
description = "ブラウザで実描画を確認する(serve を先に起動)"
# 引数なしなら一時ディレクトリに撮ります。保存先を指定するときだけ渡します。
run = "node {{env.PIPELINE}}/render_check.mjs {{arg(name='outdir', default='')}}"
