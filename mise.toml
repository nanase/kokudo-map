# mise が入れた道具を PATH の先頭に置く。
# 既定の false では末尾に足すので、システムに入っている node や python が
# 先に見つかり、上の [tools] が実質何も決めていない状態になる。
[settings]
activate_aggressive = true

[tools]
node = "26"
python = "3.14"
bun = "1.3"
# ほぼ全てのタスクが `uv run` で始まるのに、道具として宣言されていなかった。
# 手元では別に入れた uv が拾われていたので気付かない。CI や他人の環境では
# 最初のタスクで転ぶ。依存を解決するのは uv なので、その uv 自身をここが述べる。
uv = "0.12"

[env]
# The build scripts belong to the national-route-data skill.
SKILL = ".claude/skills/national-route-data/scripts"
# 生成系の入口は全部 `uv run` なので、どの Python で地図が作られるかは uv が
# 決めていた。スクリプトの requires-python は >=3.12 としか言わないので、uv は
# 手持ちの最も新しいものを選ぶ。__pycache__ には 3.13 と 3.14 の両方の跡が
# 残っており、版は誰も選ばないまま二度入れ替わっている。上の [tools] に決めさせる。
UV_PYTHON = "3.14"
# コンソールが表せない字で落ちないようにする。文字コードは変えず、扱いだけ変える。
# 日本語 Windows の cp932 は「尾駮バイパス」の駮も、区切りの — も表せない。
# それで青森県の判定と PMTiles の書き出しが最後の 1 行で落ちた。
PYTHONIOENCODING = ":replace"

[tasks.fetch-pbf]
description = "Geofabrik から japan-latest.osm.pbf を取得する（約 2.5 GB）"
# 1 行で書く。mise は Windows では cmd に渡すので、複数行の run は 1 行目しか
# 実行されず、しかも黙って成功する。--create-dirs が mkdir の代わりをする。
run = "curl -L --retry 3 -C - --create-dirs -o build/pbf/japan-latest.osm.pbf https://download.geofabrik.de/asia/japan-latest.osm.pbf"

[tasks.extract]
description = "pbf から 47 都道府県ぶんのキャッシュを切り出す"
run = "uv run {{env.SKILL}}/extract_pbf.py {{arg(name='regions', var=true, default='')}}"

[tasks.build-all]
description = "全地域を作り直し、結合して配信データまで通す"
run = "uv run {{env.SKILL}}/build_all.py {{arg(name='regions', var=true, default='')}}"

[tasks.build]
description = "1 地域を取得から検証まで通す"
run = "uv run {{env.SKILL}}/pipeline.py {{arg(name='region', default='nagano')}}"

[tasks.rebuild]
description = "1 地域をキャッシュから再生成する（取得しない）"
run = "uv run {{env.SKILL}}/pipeline.py {{arg(name='region', default='nagano')}} --skip-fetch"

[tasks.pack]
description = "build/regions/ から web/data/ を作り直す"
# 段の順番は build_all.py が持っている。ここに書き写した複製は、複数行の
# run が Windows で 1 行目しか実行されないせいで、タイルを切っただけで
# 黙って終わっていた。PMTiles にも全国検証にも届いていなかった。
run = "uv run {{env.SKILL}}/build_all.py --pack-only"

[tasks.publish-data]
description = "web/data/ を R2(data.nanase.cc)に上げる"
# データは git に入れない。R2 の資産として置き、サイトはそこから直接読む。
run = "uv run {{env.SKILL}}/publish_data.py"

[tasks.audit]
description = "鎖が切れている路線を機械的に探す"
run = "uv run {{env.SKILL}}/audit.py {{arg(name='region', default='nagano')}}"

[tasks.compare]
description = "Overpass 由来の基準と pbf 由来の生成物を突き合わせる"
run = "uv run {{env.SKILL}}/compare_sources.py {{arg(name='region', default='nagano')}}"

[tasks.serve]
description = "ローカルサーバを起動する (http://localhost:8000/)"
# PMTiles は Range 要求で読むので、http.server では配れない。
run = "uv run {{env.SKILL}}/serve.py {{arg(name='port', default='8000')}}"

[tasks.render-check]
description = "ブラウザで実描画を確認する（serve を先に起動）"
# 引数なしなら一時ディレクトリに撮る。保存先を指定するときだけ渡す。
run = "node {{env.SKILL}}/render_check.mjs {{arg(name='outdir', default='')}}"
