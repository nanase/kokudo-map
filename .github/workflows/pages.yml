# 地図を GitHub Pages に配ります。
#
# 配信データ（タイルと集計）はリポジトリに入っていません。ODbL のデータを MIT の
# コードと同じ木に置かないため、また 55 MB の gzip 済みタイルを作り直すたびに
# 履歴へ丸ごと積まないためです。理由は .gitignore に書いてあります。
#
# データ自体は GitHub Pages を経由しません。data.nanase.cc(Cloudflare R2)に
# 直接置き、`mise run publish-data` がそこへ上げます。GitHub Pages の裏側にいる
# Fastly が、ファイル先頭以外への Range 要求を壊す不具合を抱えており、Pages
# 経由では PMTiles を正しく配れませんでした。ここではコードだけを配り、web/ の中の
# 相対パス('data/…')を data.nanase.cc の絶対 URL に書き換えます。
name: Pages に配る

on:
  # コードを変えたときだけです。データの差し替えは Pages を経由しないので、
  # publish_data.py はもうこれを叩きません。
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 配信は 1 本ずつです。走っている途中のものは止めません(中途半端な公開を避ける)。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 検査は check.yml が一度だけ定義しています。ここで書き写すと二箇所になります。
  # 通らないものは配りません。
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 版はタグで指定しています。より厳しくするならコミット SHA で留めます。
      - uses: actions/checkout@v4

      # 道具の版は mise.toml だけが述べます。ここで書き写すと二箇所になります。
      - uses: jdx/mise-action@v2

      # ブラウザ用ライブラリを web/vendor/ に複製します。unpkg は読みません。
      # 版は bun.lock が留めているので、ここで解決が動くことはありません。
      - name: ライブラリを組み込む
        run: |
          bun install --frozen-lockfile --production
          bun run vendor
          test -s web/vendor/maplibre-gl.js
          test -s web/vendor/pmtiles.js

      # data.nanase.cc に直接向けます。'data/…' は手元の scripts/serve.py 用の
      # 相対パスなので、置き換え忘れれば 404 になって検査で気付きます。
      - name: 配信データの向き先を書き換える
        run: |
          sed -i "s|'data/national-routes.pmtiles'|'https://data.nanase.cc/national-routes.pmtiles'|" web/mapspec.mjs
          sed -i "s|'data/regions.json'|'https://data.nanase.cc/regions.json'|" web/app.js
          sed -i "s|'data/national.meta.json'|'https://data.nanase.cc/national.meta.json'|" web/app.js
          ! grep -q "'data/national-routes.pmtiles'" web/mapspec.mjs
          ! grep -q "'data/regions.json'" web/app.js
          ! grep -q "'data/national.meta.json'" web/app.js

      - uses: actions/configure-pages@v5
        id: pages

      # 共有されたときの札は絶対 URL でないと読まれません。その URL を述べるのは
      # ここだけです。index.html は %SITE_URL% と書いて待っています。
      - name: 公開 URL を埋める
        run: |
          sed -i "s|%SITE_URL%|${{ steps.pages.outputs.base_url }}/|g" web/index.html
          ! grep -q '%SITE_URL%' web/index.html

      # 組み上がった web/ をそのまま配ります。バンドラは通しません。index.html が
      # 読むのは相対パスだけなので、user.github.io/<repo>/ の下でも動きます。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4

      # Cloudflare は nanase.cc の手前でエッジキャッシュを持ち、Pages のデプロイとは
      # 無関係に動いている。.js/.mjs/.css は GitHub Pages が返す
      # cache-control: max-age=172800(48時間)をそのまま尊重するので、ここで
      # 明示的にパージしないと最大48時間古いファイルが配られ続ける。HTML は
      # Cloudflare が基本キャッシュしないので対象に含めていない。
      #
      # トークンは Cache Purge 権限のみ・nanase.cc ゾーンのみに絞ってある
      # (CLOUDFLARE_CACHE_PURGE_TOKEN、github-pages environment の Secret)。
      # ファイル名にハッシュを付けていないため URL 単位でしか指定できない。
      # web/ 直下に新しい .mjs や静的資材を足したときは、ここにも追記が要る
      # (追記を忘れても壊れはしないが、そのファイルだけ古いまま配られる)。
      - name: Cloudflare のキャッシュをパージする
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          response=$(curl -sSf -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data @- <<'JSON'
          {"files": [
            "https://nanase.cc/",
            "https://nanase.cc/index.html",
            "https://nanase.cc/app.js",
            "https://nanase.cc/mapspec.mjs",
            "https://nanase.cc/termini.mjs",
            "https://nanase.cc/aggregate.mjs",
            "https://nanase.cc/shield.mjs",
            "https://nanase.cc/html.mjs",
            "https://nanase.cc/panel.mjs",
            "https://nanase.cc/popup.mjs",
            "https://nanase.cc/style.css",
            "https://nanase.cc/favicon.svg",
            "https://nanase.cc/og.png",
            "https://nanase.cc/vendor/maplibre-gl.js",
            "https://nanase.cc/vendor/maplibre-gl.css",
            "https://nanase.cc/vendor/pmtiles.js"
          ]}
          JSON
          )
          echo "$response" | grep -q '"success":true'
