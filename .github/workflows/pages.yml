# 地図を GitHub Pages に配ります。
#
# 配信データ（タイルと集計）はリポジトリに入っていません。ODbL のデータを MIT の
# コードと同じ木に置かないため、また 55 MB の gzip 済みタイルを作り直すたびに
# 履歴へ丸ごと積まないためです。理由は .gitignore に書いてあります。
#
# データ自体は GitHub Pages を経由しません。data.nanase.cc(Cloudflare R2)に
# 直接置き、`mise run publish-data` がそこへ上げます。GitHub Pages の裏側にいる
# Fastly が、ファイル先頭以外への Range 要求を壊す不具合を抱えており、Pages
# 経由では PMTiles を正しく配れませんでした。ここではコードだけを配り、web/ の中の
# 相対パス('data/…')を data.nanase.cc の絶対 URL に書き換えます。
name: Pages に配る

on:
  # コードを変えたときだけです。データの差し替えは Pages を経由しないので、
  # publish_data.py はもうこれを叩きません。
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 配信は 1 本ずつです。走っている途中のものは止めません(中途半端な公開を避ける)。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 検査は check.yml が一度だけ定義しています。ここで書き写すと二箇所になります。
  # 通らないものは配りません。
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 版はタグで指定しています。より厳しくするならコミット SHA で留めます。
      - uses: actions/checkout@v4

      # 道具の版は mise.toml だけが述べます。ここで書き写すと二箇所になります。
      - uses: jdx/mise-action@v2

      # ブラウザ用ライブラリを web/vendor/ に複製します。unpkg は読みません。
      # 版は bun.lock が留めているので、ここで解決が動くことはありません。
      - name: ライブラリを組み込む
        run: |
          bun install --frozen-lockfile --production
          bun run vendor
          test -s web/vendor/maplibre-gl.js
          test -s web/vendor/pmtiles.js

      # data.nanase.cc に直接向けます。'data/…' は手元の pipeline/serve.py 用の
      # 相対パスなので、置き換え忘れれば 404 になって検査で気付きます。
      - name: 配信データの向き先を書き換える
        run: |
          sed -i "s|'data/national-routes.pmtiles'|'https://data.nanase.cc/national-routes.pmtiles'|" web/mapspec.mjs
          sed -i "s|'data/regions.json'|'https://data.nanase.cc/regions.json'|" web/app.js
          sed -i "s|'data/national.meta.json'|'https://data.nanase.cc/national.meta.json'|" web/app.js
          ! grep -q "'data/national-routes.pmtiles'" web/mapspec.mjs
          ! grep -q "'data/regions.json'" web/app.js
          ! grep -q "'data/national.meta.json'" web/app.js

      - uses: actions/configure-pages@v5
        id: pages

      # steps.pages.outputs.base_url は実測で http:// を返す(独自ドメインで
      # Enforce HTTPS が無効なため)。ここで一度だけ https に正規化し、以降は
      # このステップの出力だけを使う。
      - name: 公開 URL を https に正規化する
        id: site_url
        run: |
          echo "url=$(echo '${{ steps.pages.outputs.base_url }}' | sed 's|^http://|https://|')" >> "$GITHUB_OUTPUT"

      # 共有されたときの札は絶対 URL でないと読まれません。その URL を述べるのは
      # ここだけです。index.html は %SITE_URL% と書いて待っています。
      - name: 公開 URL を埋める
        run: |
          sed -i "s|%SITE_URL%|${{ steps.site_url.outputs.url }}/|g" web/index.html
          ! grep -q '%SITE_URL%' web/index.html

      # 組み上がった web/ をそのまま配ります。バンドラは通しません。index.html が
      # 読むのは相対パスだけなので、user.github.io/<repo>/ の下でも動きます。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4

      # Cloudflare のエッジキャッシュの保持期限は、GitHub Pages が返す
      # cache-control: max-age=600(10分)で決まる。応答ヘッダーに見える
      # max-age=172800(48時間)は Cloudflare のゾーン設定(Browser Cache TTL)
      # がブラウザ向けにだけ被せている値で、エッジ自身の保持期限には効かない。
      # つまりパージなしでもエッジの古さは最大10分で、ここでのパージはその
      # 10分を0にする。一方、ブラウザが握る48時間のキャッシュは URL が変わらない
      # 限り再検証されないため、この URL 単位のパージでは届かない(ファイル名に
      # ハッシュを付けていないのでキャッシュバスティングもできない。ブラウザ側の
      # 手当てはこの PR の範囲外)。
      #
      # パージ対象は web/ 配下を丸ごと走査して作る。upload-pages-artifact が
      # web/ をそのまま配信物にしている(上の path: web)ため、web/ にある物は
      # 全て配信され、理論上すべてキャッシュされうる。一覧を手で持つと、ファイル
      # を足したのにここへの追記を忘れて古いまま配られる不具合が起きる
      # (実際に urlstate.mjs・wiring.mjs・vendor/roboto-latin-700-normal.woff2
      # で起きた)。走査ならその種類の漏れは構造的に起きない。
      #
      # base_url は「公開 URL を埋める」と同じ steps.site_url.outputs.url を使う。
      # nanase.cc はユーザーページの独自ドメインで、このリポジトリはプロジェクト
      # サイトとして nanase.cc/kokudo-map/ に乗る。ドメイン直下を決め打ちすると、
      # 実際にキャッシュされている URL と一致せず何もパージできない。
      #
      # トークンは Cache Purge 権限のみ・nanase.cc ゾーンのみに絞ってある
      # (CLOUDFLARE_CACHE_PURGE_TOKEN、github-pages environment の Secret)。
      # ファイル名にハッシュを付けていないため URL 単位でしか指定できない。
      # Cloudflare の purge_cache は1回の呼び出しで URL 30件までしか受け付け
      # ない。現状は web/ 配下(vendor/ を含む)で20件台なので収まっているが、
      # 超えれば Cloudflare の応答が success: false になり、下の jq -e が
      # 落ちて気付ける。
      - name: Cloudflare のキャッシュをパージする
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SITE_URL: ${{ steps.site_url.outputs.url }}
        run: |
          set -euo pipefail
          # "" はルート(ディレクトリ索引)。以降は web/ 配下の全ファイルを
          # web/ からの相対パスに直して並べる。find | sort を素通しの
          # process substitution で読むと find の失敗を set -e が拾えない
          # ため、一度ファイルへ書き出してからループへ渡す。
          paths_file=$(mktemp)
          trap 'rm -f "$paths_file"' EXIT
          find web -type f -print0 | sort -z > "$paths_file"

          paths=("")
          while IFS= read -r -d '' file; do
            paths+=("${file#web/}")
          done < "$paths_file"

          # ファイル名に改行が混じっても1件のまま扱えるよう、printf/jq -R
          # でテキスト化せず、argv 経由(jq --args)でそのまま渡す。区切りの
          # "/" は残したまま、各階層ごとに @uri で percent-encode する
          # (# ? 空白 改行 等を含むパスでも配信 URL と一致させるため)。
          payload=$(jq -n --arg base "$SITE_URL" '
              {files: ($ARGS.positional | map(
                $base + "/" + (split("/") | map(@uri) | join("/"))
              ))}
            ' --args "${paths[@]}")
          echo "パージ対象:"
          echo "$payload" | jq .

          response=$(curl -sSf -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Cloudflare の応答:"
          echo "$response" | jq .
          echo "$response" | jq -e '.success == true' > /dev/null
