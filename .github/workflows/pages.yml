# 地図を GitHub Pages に配る。
#
# 配信データ（タイルと集計）はリポジトリに入っていない。ODbL のデータを MIT の
# コードと同じ木に置かないため、また 55 MB の gzip 済みタイルを作り直すたびに
# 履歴へ丸ごと積まないためである。理由は .gitignore に書いてある。
#
# その代わり、データは Release の資産として置く。ここではそれを落としてきて
# web/ に組み立て、Pages に渡す。上げるのは手元の `mise run publish-data` である。
name: Pages に配る

on:
  # コードを変えたとき
  push:
    branches: [main]
  # データを差し替えたとき（publish_data.py がこれを叩く）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 配信は 1 本ずつ。走っている途中のものは止めない（中途半端な公開を避ける）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 検査は check.yml が一度だけ定義している。ここで書き写すと二箇所になる。
  # 通らないものは配らない。
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 版はタグで指定している。より厳しくするならコミット SHA で留める。
      - uses: actions/checkout@v4

      # 道具の版は mise.toml だけが述べる。ここで書き写すと二箇所になる。
      - uses: jdx/mise-action@v2

      # ブラウザ用ライブラリを web/vendor/ に複製する。unpkg は読まない。
      # 版は bun.lock が留めているので、ここで解決が動くことはない。
      - name: ライブラリを組み込む
        run: |
          bun install --frozen-lockfile --production
          bun run vendor
          test -s web/vendor/maplibre-gl.js
          test -s web/vendor/pmtiles.js

      - name: 配信データを Release から取る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/data
          gh release download data-latest --dir web/data --clobber \
            --pattern 'national.pmtiles' \
            --pattern 'national.meta.json' \
            --pattern 'regions.json' \
            --pattern 'SHA256SUMS'

      # 落ちてきた物が上げた物と同じであることを確かめる。ここで落ちれば、
      # 壊れたデータが公開されることはない。
      - name: 中身を検算する
        run: cd web/data && sha256sum -c SHA256SUMS

      - uses: actions/configure-pages@v5
        id: pages

      # 共有されたときの札は絶対 URL でないと読まれない。その URL を述べるのは
      # ここだけである。index.html は %SITE_URL% と書いて待っている。
      - name: 公開 URL を埋める
        run: |
          sed -i "s|%SITE_URL%|${{ steps.pages.outputs.base_url }}/|g" web/index.html
          ! grep -q '%SITE_URL%' web/index.html

      # 組み上がった web/ をそのまま配る。バンドラは通さない。index.html が
      # 読むのは相対パスだけなので、user.github.io/<repo>/ の下でも動く。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4
