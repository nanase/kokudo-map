# 地図を GitHub Pages に配ります。
#
# 配信データ(タイルと集計)はリポジトリに入っていません。ODbL のデータを MIT の
# コードと同じ木に置かないため、また 55 MB の gzip 済みタイルを作り直すたびに
# 履歴へ積まないためです(.gitignore)。
#
# データ自体は GitHub Pages を経由しません。GitHub Pages の裏側の Fastly が
# ファイル先頭以外への Range 要求を壊す不具合を抱え、PMTiles を正しく配れません
# でした。data.nanase.cc(Cloudflare R2)に直接置き、`mise run publish-data` が
# そこへ上げます。ここではコードだけを配り、web/ の中の相対パス('data/…')を
# data.nanase.cc の絶対 URL に書き換えます。
name: Pages に配る

on:
  # コードを変えたときだけです。データの差し替えは Pages を経由しないので、
  # publish_data.py はもうこれを叩きません。
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 配信は 1 本ずつです。走っている途中の物は止めません(中途半端な公開を
# 避ける)。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 検査は check.yml が一度だけ定義しています。ここで書き写すと二箇所に
  # なります。
  # 通らないものは配りません。
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 版はタグで指定しています。より厳しくするならコミット SHA で留めます。
      - uses: actions/checkout@v4

      # 道具の版は mise.toml だけが述べます。ここで書き写すと二箇所になります。
      - uses: jdx/mise-action@v2

      # ブラウザ用ライブラリを web/vendor/ に複製します。unpkg は読みません。
      # 版は bun.lock が留めているので、ここで解決が動くことはありません。
      - name: ライブラリを組み込む
        run: |
          bun install --frozen-lockfile --production
          bun run vendor
          test -s web/vendor/maplibre-gl.js
          test -s web/vendor/pmtiles.js
          test -s web/vendor/line-seed-jp.css
          test -s web/vendor/eb-garamond-latin-500-normal.woff2

      # data.nanase.cc に直接向けます。配信データの基点は web/dataurl.mjs だけが
      # 持っており(mapspec.mjs・app.js はそこから組む)、書き換えるのもこの 1 行
      # だけです。置き換え忘れれば 404 になって検査で気付きます。
      - name: 配信データの向き先を書き換える
        run: |
          sed -i "s|const DATA_BASE_URL = 'data/';|const DATA_BASE_URL = 'https://data.nanase.cc/';|" web/dataurl.mjs
          ! grep -q "const DATA_BASE_URL = 'data/';" web/dataurl.mjs

      - uses: actions/configure-pages@v5
        id: pages

      # steps.pages.outputs.base_url は実測で http:// を返します(独自ドメインで
      # Enforce HTTPS が無効なため)。ここで一度だけ https に正規化し、以降は
      # このステップの出力だけを使います。
      - name: 公開 URL を https に正規化する
        id: site_url
        run: |
          echo "url=$(echo '${{ steps.pages.outputs.base_url }}' | sed 's|^http://|https://|')" >> "$GITHUB_OUTPUT"

      # 共有されたときのカードは絶対 URL でないと読まれません。その URL を
      # 述べるのはここだけです。index.html は %SITE_URL% と書いて待っています。
      - name: 公開 URL を埋める
        run: |
          sed -i "s|%SITE_URL%|${{ steps.site_url.outputs.url }}/|g" web/index.html
          ! grep -q '%SITE_URL%' web/index.html

      # 組み上がった web/ をそのまま配ります。バンドラは通しません。index.html
      # が読むのは相対パスだけなので、user.github.io/<repo>/ の下でも動きます。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4

      # Cloudflare のエッジキャッシュの保持期限は、GitHub Pages が返す
      # cache-control: max-age=600(10 分)で決まります。応答ヘッダーに見える
      # max-age=172800(48 時間)はゾーン設定(Browser Cache TTL)がブラウザ向けに
      # 被せている値で、エッジの保持期限には効きません。パージなしでもエッジの
      # 古さは最大 10 分で、ここでのパージはそれを 0 にします。ブラウザが握る
      # 48 時間のキャッシュは URL が変わらない限り再検証されないので、URL 単位の
      # パージでは届きません。ファイル名にハッシュを付けていないため、ブラウザ側
      # の手当ては範囲外です。
      #
      # パージ対象は web/ 配下を丸ごと走査して作ります。upload-pages-artifact が
      # web/ をそのまま配信物にしている(上の path: web)ので、web/ にある物は全て
      # キャッシュされうるからです。一覧を手で持つとファイルを足したのに追記を
      # 忘れ、古いまま配られます(urlstate.mjs・wiring.mjs・
      # vendor/roboto-latin-700-normal.woff2 で起きました)。
      #
      # base_url は「公開 URL を埋める」と同じ steps.site_url.outputs.url です。
      # nanase.cc はユーザーページの独自ドメインで、このリポジトリは
      # nanase.cc/kokudo-map/ に乗ります。ドメイン直下を決め打ちすると、実際に
      # キャッシュされている URL と一致せず何もパージできません。
      #
      # トークンは Cache Purge 権限のみ・nanase.cc ゾーンのみに絞ってあります
      # (CLOUDFLARE_CACHE_PURGE_TOKEN、github-pages environment の Secret)。
      # purge_cache は 1 回に URL 30 件までなので、30 件ずつに割って送ります。
      # web/vendor/ だけで woff2 が 248 個あります。1 回でも失敗すれば下の jq -e
      # が落ちて気付けます。
      - name: Cloudflare のキャッシュをパージする
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SITE_URL: ${{ steps.site_url.outputs.url }}
        run: |
          set -euo pipefail
          # "" はルート(ディレクトリ索引)です。以降は web/ 配下の全ファイルを
          # web/ からの相対パスに直して並べます。find | sort を素通しの
          # process substitution で読むと find の失敗を set -e が拾えないので、
          # 一度ファイルへ書き出してからループへ渡します。
          paths_file=$(mktemp)
          trap 'rm -f "$paths_file"' EXIT
          find web -type f -print0 | sort -z > "$paths_file"

          paths=("")
          while IFS= read -r -d '' file; do
            paths+=("${file#web/}")
          done < "$paths_file"

          # 1 回あたり 30 件。Cloudflare の purge_cache がそれ以上を受け付けません。
          for ((i = 0; i < ${#paths[@]}; i += 30)); do
            batch=("${paths[@]:i:30}")

            # ファイル名に改行が混じっても 1 件のまま扱えるよう、printf/jq -R
            # でテキスト化せず、argv 経由(jq --args)でそのまま渡します。区切りの
            # "/" は残したまま、各階層ごとに @uri で percent-encode します
            # (# ? 空白 改行 等を含むパスでも配信 URL と一致させるため)。
            payload=$(jq -n --arg base "$SITE_URL" '
                {files: ($ARGS.positional | map(
                  $base + "/" + (split("/") | map(@uri) | join("/"))
                ))}
              ' --args "${batch[@]}")
            echo "パージ対象 $((i + 1))〜$((i + ${#batch[@]})) / ${#paths[@]}:"
            echo "$payload" | jq -c '.files'

            response=$(curl -sSf -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload")
            echo "Cloudflare の応答:"
            echo "$response" | jq .
            echo "$response" | jq -e '.success == true' > /dev/null
          done
