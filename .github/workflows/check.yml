# push と pull request のたびに、データを持たない検査を回します。
#
# ここで走らせられるのは「コードについての問い」だけです。判定の正しさや実描画
# は 2.5 GB の pbf と 47 地域ぶんの生成を要求するので、手元でしか答えられません。
# 分かれ目は check_expressions.mjs の --spec-only にそのまま出ています。
name: 検査

on:
  # main への push は配信の workflow がこれを呼ぶので、そちらに任せます。
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 道具の版は mise.toml だけが述べます。
      - uses: jdx/mise-action@v2

      # --frozen-lockfile なので、package.json と bun.lock が食い違えばここで落ちます。
      - run: bun install --frozen-lockfile

      - name: 静的検査
        run: bun run lint

      # 集計、絞り込み式、標識の作図。データを持たずに答えられる問いを見ます。
      - name: 単体テスト
        run: bun test test/

      # スタイルと絞り込み式が MapLibre の仕様に適合するか。式を書き写した複製
      # ではなく web/mapspec.mjs 自身を読んで検査します。
      - name: スタイルと絞り込み式
        run: bun run check --spec-only

      # uv 越しに走らせます。この構成の Python は全部 uv が起動するので、
      # 構文を見るついでに uv が入っていること自体を毎回確かめられます。
      # 命令の一覧が mise.toml・package.json・docs/development.md で食い違わないことを確かめます。
      - name: 文書と定義の突き合わせ
        run: bun run check:docs

      - name: Python の構文
        run: uv run python -m compileall -q pipeline

      - name: Python の静的検査
        run: uvx ruff check pipeline

      # 配信時にライブラリを複製できることを、配信の前に確かめます。
      - name: 資材を組める
        run: |
          bun run vendor
          test -s web/vendor/maplibre-gl.js
          test -s web/vendor/pmtiles.js

      # 配信の workflow は index.html の %SITE_URL% を実際の URL に差し替えます。
      # 差し替える先が消えていれば、共有カードは黙って壊れたまま公開されます。
      - name: 埋める先が残っている
        run: grep -q '%SITE_URL%' web/index.html

      # ラベルのグリフは追跡しています。字が足りなければ地図から番号が消えるので、
      # ファイルが揃っていることだけは毎回見ます。
      - name: グリフが揃っている
        run: |
          test -s web/glyphs/NotoSansJP-Regular/0-255.pbf
          test -s web/glyphs/NotoSansJP-Regular/12288-12543.pbf
