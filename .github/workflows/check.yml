# push と pull request のたびに、データを持たない検査を回す。
#
# ここで走らせられるのは「コードについての問い」だけである。判定の正しさや実描画
# は 2.5 GB の pbf と 47 地域ぶんの生成を要求するので、手元でしか答えられない。
# 分かれ目は check_expressions.mjs の --spec-only にそのまま出ている。
name: 検査

on:
  # main への push は配信の workflow がこれを呼ぶので、そちらに任せる。
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 道具の版は mise.toml だけが述べる。
      - uses: jdx/mise-action@v2

      # --frozen-lockfile なので、package.json と bun.lock が食い違えばここで落ちる。
      - run: bun install --frozen-lockfile

      - name: 静的検査
        run: bun run lint

      # スタイルと絞り込み式が MapLibre の仕様に適合するか。式を書き写した複製
      # ではなく web/mapspec.mjs 自身を読んで検査する。
      - name: スタイルと絞り込み式
        run: bun run check --spec-only

      - name: Python の構文
        run: python -m compileall -q .claude/skills/national-route-data/scripts

      # 配信時にライブラリを複製できることを、配信の前に確かめる。
      - name: 資材を組める
        run: |
          bun run vendor
          test -s web/vendor/maplibre-gl.js
          test -s web/vendor/pmtiles.js

      # 配信の workflow は index.html の %SITE_URL% を実際の URL に差し替える。
      # 差し替える先が消えていれば、共有用の札は黙って壊れたまま公開される。
      - name: 埋める先が残っている
        run: grep -q '%SITE_URL%' web/index.html

      # ラベルのグリフは追跡している。字が足りなければ地図から番号が消えるので、
      # ファイルが揃っていることだけは毎回見る。
      - name: グリフが揃っている
        run: |
          test -s web/glyphs/NotoSansJP-Regular/0-255.pbf
          test -s web/glyphs/NotoSansJP-Regular/12288-12543.pbf
