# 配信データの形(meta.json の内訳)を変えるファイルが PR に入ったとき、
# マージ後に mise run publish-data が要ることを PR 上で知らせます。
#
# docs/architecture.md には「main へ push しても Pages はデータに触れない」と
# 既に書いてありますが、それは知識であって、変更が通る瞬間に気付ける手掛かり
# ではありません。#163 で抜けたのはその手掛かりのほうです。
name: 配信データの形が変わる合図

on:
  pull_request:
    paths:
      - "pipeline/pack_web.mjs"
      - "pipeline/pack_web_pref.mjs"
      - "pipeline/rollup.mjs"

permissions:
  pull-requests: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      # 同じ PR に push を重ねても、二重には貼りません。
      - name: マージ後の publish-data を促す
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- publish-data-reminder -->';
            const body = `${marker}\nこの PR は配信データの形を変えます。マージ後に \`mise run publish-data\` を回してください。`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            if (comments.some((c) => c.body.includes(marker))) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
