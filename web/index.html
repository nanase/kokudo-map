<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>国道マップ — 重用区間で番号を丸めない日本の国道地図</title>
<meta name="description" content="日本の一般国道 459 路線を全国 1 枚で表示する地図。重用区間では重なるすべての番号を出し、縮尺を引いても番号を省略しない。出典は OpenStreetMap。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<!-- 共有されたときに出る札。%SITE_URL% は配信時に Actions が実際の URL に
     差し替える。GitHub Pages の URL を述べるのはそこだけである。 -->
<meta property="og:type" content="website">
<meta property="og:title" content="国道マップ">
<meta property="og:description" content="重用区間で番号を丸めない。縮尺で番号を省略しない。全国 47 都道府県・一般国道 459 路線。">
<meta property="og:url" content="%SITE_URL%">
<meta property="og:image" content="%SITE_URL%og.png">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <aside id="panel">
    <header>
      <img src="favicon.svg" alt="" class="brand-icon">
      <h1>国道マップ</h1>
    </header>

    <section class="block">
      <div class="filter-row">
        <input type="search" id="route-filter" placeholder="番号で絞り込み（例: 15）" autocomplete="off">
        <button type="button" id="sel-none" class="mini" disabled>選択解除</button>
      </div>
      <div id="route-list" class="route-list" role="group" aria-label="国道の選択"></div>
    </section>

    <section class="block">
      <div class="block-hd"><h2>重用区間</h2></div>
      <div class="radios" role="radiogroup" aria-label="重用区間の表示">
        <label><input type="radio" name="conc" value="off" checked> 強調しない</label>
        <label><input type="radio" name="conc" value="all"> 重用区間のみ表示</label>
      </div>
      <div id="legend-n" class="legend"></div>
    </section>

    <section class="block">
      <div class="block-hd"><h2>表示</h2></div>
      <div class="checks">
        <label><input type="checkbox" id="t-labels" checked> 路線番号</label>
        <label><input type="checkbox" id="t-termini" checked> 起点・終点</label>
        <label><input type="checkbox" id="t-expressway" checked> 自動車専用道路（高速道路）</label>
        <label><input type="checkbox" id="t-special" checked> 点線国道・工事中・未開通</label>
        <label><input type="checkbox" id="t-ferry" checked> 海上国道</label>
      </div>
      <div id="legend-kind" class="legend"></div>
    </section>

    <section class="block">
      <details id="ranking-block">
        <summary>
          <h2>重用ランキング</h2>
          <span class="count" id="ranking-count"></span>
        </summary>
        <p class="hint">通常の地図が番号の若いものだけを描いてしまう区間。行をクリックするとその区間へ移動します。</p>
        <div id="ranking" class="ranking"></div>
      </details>
    </section>

    <section class="block">
      <details id="shared-block">
        <summary>
          <h2>起終点を共有する地点</h2>
          <span class="count" id="shared-count"></span>
        </summary>
        <p class="hint">行をクリックするとその地点へ移動します。</p>
        <div id="shared" class="ranking"></div>
      </details>
    </section>

    <footer>
      <div id="stats" class="stats"></div>
      <dl id="freshness" class="freshness"></dl>
      <!-- 出典は地図の上の表示だけが述べる。ここにも書くと二箇所になる。 -->
    </footer>
  </aside>

  <main id="map-wrap">
    <div id="map"></div>
    <!-- 地図の上に置く。閉じている間もここに残るので、開き直す口が必ずある。 -->
    <button type="button" id="panel-toggle" aria-controls="panel" aria-expanded="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div id="loading">データを読み込んでいます…</div>
  </main>
</div>

<!-- 同一オリジンから配る。版は package.json が一度だけ述べ、
     scripts/vendor_web.mjs が node_modules から複製する。 -->
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
