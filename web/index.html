<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>国道マップ</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <aside id="panel">
    <header>
      <h1>国道マップ</h1>
    </header>

    <section class="block">
      <div class="block-hd">
        <h2>路線</h2>
        <div class="hd-actions">
          <button type="button" id="sel-none" class="mini">解除</button>
        </div>
      </div>
      <input type="search" id="route-filter" placeholder="番号で絞り込み（例: 15）" autocomplete="off">
      <div id="route-list" class="route-list" role="group" aria-label="国道の選択"></div>
      <p class="hint" id="sel-hint"></p>
    </section>

    <section class="block">
      <div class="block-hd"><h2>重用区間</h2></div>
      <div class="radios" role="radiogroup" aria-label="重用区間の表示">
        <label><input type="radio" name="conc" value="off" checked> 強調しない</label>
        <label><input type="radio" name="conc" value="all"> 重用区間のみ表示</label>
      </div>
      <div id="legend-n" class="legend"></div>
    </section>

    <section class="block">
      <div class="block-hd"><h2>表示</h2></div>
      <div class="checks">
        <label><input type="checkbox" id="t-labels" checked> 路線番号を常時表示</label>
        <label><input type="checkbox" id="t-termini" checked> 起点・終点</label>
        <label><input type="checkbox" id="t-special" checked> 点線国道・工事中・未開通</label>
        <label><input type="checkbox" id="t-ferry" checked> 海上国道</label>
      </div>
      <div id="legend-kind" class="legend"></div>
    </section>

    <section class="block">
      <details id="ranking-block">
        <summary>
          <h2>重用ランキング</h2>
          <span class="count" id="ranking-count"></span>
        </summary>
        <p class="hint">通常の地図が番号の若いものだけを描いてしまう区間。行をクリックすると絞り込みます。</p>
        <div id="ranking" class="ranking"></div>
      </details>
    </section>

    <section class="block">
      <details id="shared-block">
        <summary>
          <h2>起終点を共有する地点</h2>
          <span class="count" id="shared-count"></span>
        </summary>
        <div id="shared" class="ranking"></div>
      </details>
    </section>

    <footer>
      <div id="stats" class="stats"></div>
      <dl id="freshness" class="freshness"></dl>
      <!-- 出典は地図の上の表示だけが述べる。ここにも書くと二箇所になる。 -->
    </footer>
  </aside>

  <main id="map-wrap">
    <div id="map"></div>
    <!-- 地図の上に置く。閉じている間もここに残るので、開き直す口が必ずある。 -->
    <button type="button" id="panel-toggle" aria-controls="panel" aria-expanded="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div id="loading">データを読み込んでいます…</div>
  </main>
</div>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4/dist/pmtiles.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
